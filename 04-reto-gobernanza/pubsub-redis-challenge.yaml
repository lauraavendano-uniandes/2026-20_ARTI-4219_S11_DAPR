apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: order-pubsub
  namespace: default
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis-master.redis.svc.cluster.local:6379"

    - name: redisPassword
      value: ""

    # ---------------------------------------------------------------------------
    # 1: Configurar Time-to-Live (TTL) para los mensajes
    # ---------------------------------------------------------------------------
    
      - name: ttlInSeconds value: "120"
        value: "120"
    # ---------------------------------------------------------------------------
    # 2: Configurar Consumer Group con Namespace para Multi-Tenancy
    # ---------------------------------------------------------------------------
       - name: consumerID
         value: "{namespace}"
